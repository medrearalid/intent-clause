name: Validate skill

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Agent Skills validator
        run: python -m pip install skills-ref==0.1.1
      - name: Validate Agent Skills specification
        run: agentskills validate "${{ github.workspace }}"
      - name: Validate IntentClause invariants
        run: python scripts/validate_skill.py
      - name: Test routing, memory, and installers
        run: python -m unittest discover -s tests -v
